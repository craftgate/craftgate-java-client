name: Craftgate Java CI

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '8', '11', '17', '21', '25' ]
    name: Build with Java ${{ matrix.java-version }}

    steps:
      - uses: actions/checkout@v7

      # The library is compiled with Java 8 (the last listed version becomes JAVA_HOME);
      # the tests run on the matrix version.
      - name: Set up JDK ${{ matrix.java-version }} and JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: |
            ${{ matrix.java-version }}
            8

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build with Gradle
        run: |
          TEST_JAVA_HOME=$(printenv "JAVA_HOME_${{ matrix.java-version }}_X64")
          "$TEST_JAVA_HOME/bin/java" -version
          ./gradlew build test -PtestJavaHome="$TEST_JAVA_HOME"

  release-dry-run:
    runs-on: ubuntu-latest
    name: Release dry run

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '8'

      # Same version validation as the release workflow, with a fake "v" prefixed version.
      - name: Validate version
        run: .github/scripts/prepare-release.sh v9.9.9

      - name: Build release artifacts without signing or publishing
        run: |
          test "$VERSION" = "9.9.9"
          ./gradlew clean test publishToMavenLocal -Pversion="$VERSION" -x signMavenJavaPublication

      - name: Verify the version in the artifacts
        run: |
          dir=~/.m2/repository/io/craftgate/craftgate/$VERSION
          ls "$dir"
          grep -q "<version>$VERSION</version>" "$dir/craftgate-$VERSION.pom"
          unzip -p "$dir/craftgate-$VERSION.jar" io/craftgate/craftgate-version.properties | grep -qx "version=$VERSION"

  # Single "build" status for branch protection: passes only if every job above passed.
  build:
    if: always()
    needs: [ test, release-dry-run ]
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.release-dry-run.result }}" = "success"
