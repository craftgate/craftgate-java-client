plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'commons-codec:commons-codec:1.15'

    compileOnly "org.projectlombok:lombok:1.18.4"
    annotationProcessor("org.projectlombok:lombok:1.18.4")

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.6.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.6.2'
}

test {
    useJUnitPlatform()
    exclude 'io/craftgate/sample/**'
    systemProperty 'craftgate.expectedVersion', project.version.toString() == 'unspecified' ? 'unknown' : project.version.toString()
}

tasks.register('sampleTest', Test) {
    description = 'Runs the samples against the Craftgate sandbox API.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'io/craftgate/sample/**'
}

if (project.hasProperty('testJavaHome')) {
    tasks.withType(Test).configureEach {
        executable = new File(project.property('testJavaHome').toString(), 'bin/java').absolutePath
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('io/craftgate/craftgate-version.properties') {
        expand(version: project.version)
    }
}

group = 'io.craftgate'
sourceCompatibility = '1.8'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Craftgate'
                description = 'Craftgate Java API Client'
                url = 'https://github.com/craftgate/craftgate-java-client'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'Craftgate'
                        name = 'Craftgate'
                        email = 'info@craftgate.io'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/craftgate/craftgate-java-client'
                    developerConnection = 'scm:git:git@github.com:craftgate/craftgate-java-client'
                    url = 'https://github.com/craftgate/craftgate-java-client'
                }
            }
        }
    }
    repositories {
        maven {
            name 'ossrh-staging-api'
            url "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            credentials {
                username project.repoUser
                password project.repoPassword
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
